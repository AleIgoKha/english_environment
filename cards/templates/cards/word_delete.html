{% extends 'cards/base.html' %}
{% block title %}Delete word · Cardy{% endblock %}
{% block layout_class %}layout-form{% endblock %}
{% block header_actions %}{% include 'cards/_navigation.html' %}{% endblock %}
{% block content %}
<section class="page-heading">
  <h1>Delete this word?</h1>
</section>
<section class="panel form-panel" aria-label="Confirm deletion">
  <form method="post" class="form-actions">
    {% csrf_token %}
    <button class="button button-danger" type="submit">Delete word</button>
    <a class="button button-secondary" href="{% url 'word-edit' word.pk %}">Keep word</a>
  </form>
</section>
{% endblock %}
