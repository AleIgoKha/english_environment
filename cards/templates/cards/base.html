{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f4fc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Word by word">
    <title>{% block title %}Word by word{% endblock %}</title>
    <link rel="icon" href="{% static 'cards/icon.svg' %}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{% static 'cards/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'cards/manifest.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'cards/app.css' %}">
  </head>
  <body>
    <main class="app-shell {% block layout_class %}{% endblock %}">
      <header class="app-header">
        <a class="brand" href="{% url 'home' %}" aria-label="Word by word home">
          <span class="brand-mark" aria-hidden="true">w.</span>
          <span>word by word</span>
        </a>
        {% block header_actions %}{% endblock %}
      </header>
      <div class="page-content">
        {% block content %}{% endblock %}
      </div>
      <footer class="app-footer">A little practice. A lasting habit.</footer>
    </main>
  </body>
</html>
