{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f4fc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Cardy">
    <title>{% block title %}Cardy{% endblock %}</title>
    <link rel="icon" href="{% static 'cards/icon.svg' %}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{% static 'cards/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'cards/manifest.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'cards/app.css' %}{% if local_asset_version %}?v={{ local_asset_version }}{% endif %}">
  </head>
  <body>
    <main class="app-shell {% block layout_class %}{% endblock %}">
      <header class="app-header">
        <a class="brand" href="{% url 'home' %}" aria-label="Cardy home">
          <svg class="brand-mark" viewBox="0 0 180 180" aria-hidden="true" focusable="false">
            <rect width="180" height="180" rx="40" fill="#7254a3"/>
            <rect x="41" y="40" width="89" height="101" rx="14" fill="#cfc0e3" transform="rotate(-12 85 90)"/>
            <rect x="53" y="42" width="89" height="101" rx="14" fill="#faf7ff" transform="rotate(7 98 92)"/>
            <path d="M109 80a17 17 0 1 0 0 24" fill="none" stroke="#7254a3" stroke-width="6" stroke-linecap="round"/>
          </svg>
          <span>Cardy</span>
        </a>
        {% block header_actions %}{% endblock %}
      </header>
      <div class="page-content">
        {% block content %}{% endblock %}
      </div>
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
